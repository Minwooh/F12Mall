<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/mypage/css/mypage.css" />
    <link rel="stylesheet" href="/mypage/css/media.css" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="icon" href="/favicon.png" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <title>F12_ALL-Mypage</title>
  </head>
  <body>
    <div id="wrapper">
      <canvas id="matrix"></canvas>
      <div id="include-header"></div>
      <div id="include-detail-modal"></div>
      <div class="width">
        <!-- section : left  -->
        <div class="section-left">
          <div class="container-profile border">
            <div class="box-contents">
              <div class="image-container">
                <img id="image" src="../favicon.png" />
              </div>
              <div class="name-container">
                <div id="name">홍민우</div>
                <div id="username">민민코인</div>
              </div>
              <div class="position-email-container">
                <div id="position"></div>
                <div id="email"></div>
              </div>
              <div id="stack-container"></div>
              <div id="link-container"></div>
            </div>
            <div class="detail-btn" onclick="setModal()">DETAIL</div>
          </div>
          <div class="container-ratio">
            <div class="section-title">MyCoin Ratio</div>
            <div class="box-ratio border">
              <div class="bar-container"></div>
              <div class="box-coins">
                <div class="coin-container">
                  <div class="circle"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- section : right -->
        <div class="section-right">
          <div class="container-information">
            <div class="section-title">Coin Information</div>
            <div class="box-inform">
              <div class="main-left">
                <div class="left-top">
                  <span id="coin-name"></span>
                </div>
                <div id="bio"></div>
              </div>
              <div class="main-right">
                <div class="right-top">
                  <span id="my-coin-quantity"></span><span>/</span
                  ><span>1000</span><span>FIS</span> <span>₩</span
                  ><span id="total-value"></span>
                </div>

                <div class="total-money-container">
                  <div class="money-info-box">
                    <div class="line-box">
                      <div class="line">
                        <span>현금 : </span><span>₩</span
                        ><span id="money"></span>
                      </div>
                      <div class="line">
                        <span>코인 평가 금액 : </span><span>₩</span
                        ><span id="current-coin-amount"></span>
                      </div>
                      <div class="line">
                        <span>코인 매수 원금 : </span><span>₩</span
                        ><span id="total-coin-amount"></span>
                      </div>
                      <div class="line">
                        <span>총 보유 자산 : </span><span>₩</span
                        ><span id="total-amount"></span>
                      </div>
                    </div>
                    <div id="subtract-amount"></div>
                  </div>

                  <div class="graph-box">
                    <div id="graph"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="container-list-coins">
            <div class="section-title">List of Coins</div>
            <div class="box-list">
              <div class="total-info">
                <div><span id="total-coins"></span><span> FIS</span></div>
                <div><span>₩</span><span id="total-coin-price"></span></div>
              </div>
              <div class="coin-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- script -->
    <script src="/mypage/js/background.js"></script>
    <script type="module" src="/common/header/header.js"></script>
    <script type="module" src="/hook/auth/postLogout.js"></script>
    <script src="/mypage/js/coinelement.js"></script>
    <!-- <script src="/mypage/js/mobile.js"></script>-->
    <script type="module" src="/config.js"></script>
    <script type="module" src="/mypage/js/mypage.js"></script>
    <script type="module" src="/mypage/js/modal.js"></script>
  </body>
</html>
